<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>Payments | The Pink Room Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard-ui.css">
<style>
  .pay-grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;margin-bottom:24px;}
  @media (max-width:1020px){ .pay-grid2{grid-template-columns:1fr;} }
  .ov-card{background:#fff;border:1px solid var(--line);border-radius:5px;padding:20px 22px;}
  .ov-card h3{font-family:'Playfair Display',serif;font-weight:400;font-size:16px;margin-bottom:2px;}
  .ov-card .sub{font-size:11.5px;color:var(--ink-soft);margin-bottom:16px;}
  .pay-method-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .pay-method-row:last-child{border-bottom:none;}
  .pay-method-row .n{flex:1;}
  .pay-method-row .c{color:var(--ink-soft);font-size:11px;margin-right:8px;}
  .pay-fail-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .pay-fail-row:last-child{border-bottom:none;}
  .pay-fail-row .l span{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px;}
  .pay-integration{
    display:flex;align-items:center;gap:12px;background:var(--beige-soft);border-radius:5px;
    padding:16px 18px;margin-bottom:24px;font-size:12.5px;
  }
  .pay-integration svg{width:20px;height:20px;stroke:var(--warn);fill:none;stroke-width:1.6;flex-shrink:0;}
  .pay-integration b{display:block;margin-bottom:2px;}
</style>
</head>
<body>

  <div class="db-shell">
    <div data-dash-sidebar></div>
    <main class="db-main">
      <div data-dash-mobile-topbar></div>
      <div class="db-wrap">
        <div class="db-page-head">
          <div><h1>Payments</h1><p>Money collected, pending and failed — across every payment method.</p></div>
          <button class="db-refresh" id="payRefresh">
            <svg viewBox="0 0 24 24"><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
            REFRESH
          </button>
        </div>

        <div id="paymobBanner"></div>

        <div class="db-stats" id="payStats"></div>

        <div class="pay-grid2">
          <div class="ov-card">
            <h3>By Payment Method</h3>
            <p class="sub">All-time, every order</p>
            <div id="payByMethod"></div>
          </div>
          <div class="ov-card">
            <h3>Recent Failed Payments</h3>
            <p class="sub">Last 10</p>
            <div id="payFailed"></div>
          </div>
        </div>

        <div class="db-toolbar">
          <div class="db-search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="paySearch" placeholder="Search order id, name, phone...">
          </div>
          <select class="db-filter" id="payStatusFilter">
            <option value="">All payment statuses</option>
            <option value="pending">Pending</option>
            <option value="processing">Processing</option>
            <option value="paid">Paid</option>
            <option value="failed">Failed</option>
            <option value="cancelled">Cancelled</option>
          </select>
        </div>

        <div class="db-table-wrap">
          <table>
            <thead><tr><th>ORDER</th><th>CUSTOMER</th><th>METHOD</th><th>TOTAL</th><th>PAYMENT STATUS</th><th>DATE</th></tr></thead>
            <tbody id="payTableBody"></tbody>
          </table>
          <div class="db-empty" id="payEmpty" style="display:none">
            <svg viewBox="0 0 24 24"><path d="M2 10h20"/><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 15h4"/></svg>
            <p>No orders match this filter.</p>
          </div>
          <div class="db-pagination" id="payPagination"></div>
        </div>
      </div>
    </main>
  </div>

<script src="dashboard-ui.js"></script>
<script>
const $ = id => document.getElementById(id);
const { money, fmtDate, escHtml, toast } = DashUI;
const state = { page: 1, q: '', payment: '', searchTimer: null };

function statusBadge(status){ return `<span class="badge st-${status}"><i></i>${status.toUpperCase()}</span>`; }

async function loadSummary(){
  const r = await fetch('/api/admin/orders?action=payments');
  if (r.status === 401){ location.href = 'dashboard-login.html'; return; }
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || 'Could not load payment summary.');

  const byStatus = {};
  d.byStatus.forEach(s => byStatus[s.status] = s);

  $('payStats').innerHTML = `
    <div class="db-stat gold"><p>TOTAL COLLECTED (PAID)</p><h3>${money((byStatus.paid||{}).total||0)}</h3><span class="db-stat-link">${(byStatus.paid||{}).count||0} orders</span></div>
    <div class="db-stat warn"><p>PENDING</p><h3>${money((byStatus.pending||{}).total||0)}</h3><span class="db-stat-link">${(byStatus.pending||{}).count||0} orders</span></div>
    <div class="db-stat"><p>PROCESSING</p><h3>${money((byStatus.processing||{}).total||0)}</h3><span class="db-stat-link">${(byStatus.processing||{}).count||0} orders</span></div>
    <div class="db-stat err"><p>FAILED</p><h3>${money((byStatus.failed||{}).total||0)}</h3><span class="db-stat-link">${(byStatus.failed||{}).count||0} orders</span></div>
  `;

  const maxMethodCount = Math.max(1, ...d.byMethod.map(m => m.count));
  $('payByMethod').innerHTML = d.byMethod.length ? d.byMethod.map(m => `
    <div class="pay-method-row">
      <div class="n">${escHtml(m.methodLabel || m.methodId || 'Unknown')}</div>
      <div class="c">${m.count} order${m.count===1?'':'s'}</div>
      <b>${money(m.total)}</b>
    </div>`).join('') : '<p style="font-size:12.5px;color:var(--ink-soft)">No orders yet.</p>';

  $('payFailed').innerHTML = d.recentFailed.length ? d.recentFailed.map(f => `
    <div class="pay-fail-row">
      <div class="l"><b>#${escHtml(f.id)}</b><span>${escHtml(f.customerName||'Guest')} &middot; ${escHtml(f.paymentMethod||'')} &middot; ${fmtDate(f.createdAt)}</span></div>
      <b>${money(f.total)}</b>
    </div>`).join('') : '<p style="font-size:12.5px;color:var(--ink-soft)">No failed payments.</p>';

  $('paymobBanner').innerHTML = d.paymob.configured
    ? `<div class="pay-integration"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg><div><b>Paymob is configured</b>Webhook secret detected — card payments can go live once checkout.js enables the Paymob option.</div></div>`
    : `<div class="pay-integration"><svg viewBox="0 0 24 24"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg><div><b>Paymob integration pending</b>The webhook endpoint and HMAC verification are built and ready — set PAYMOB_API_KEY, PAYMOB_INTEGRATION_ID and PAYMOB_HMAC_SECRET to connect a real Paymob account. All current orders use Cash on Delivery / manual payment methods.</div></div>`;
}

function renderPagination(total, page, pageSize){
  const pages = Math.max(1, Math.ceil(total / pageSize));
  const from = total ? (page-1)*pageSize + 1 : 0;
  const to = Math.min(total, page*pageSize);
  $('payPagination').innerHTML = `
    <span>${from}&ndash;${to} of ${total} order${total===1?'':'s'}</span>
    <div class="db-pagination-btns">
      <button id="payPrev" ${page<=1?'disabled':''}>&larr; Previous</button>
      <button id="payNext" ${page>=pages?'disabled':''}>Next &rarr;</button>
    </div>`;
  $('payPrev').addEventListener('click', ()=>{ if(state.page>1){ state.page--; loadOrders(); } });
  $('payNext').addEventListener('click', ()=>{ if(state.page<pages){ state.page++; loadOrders(); } });
}

async function loadOrders(){
  const params = new URLSearchParams({ page: state.page, q: state.q, payment: state.payment });
  const r = await fetch('/api/admin/orders?' + params.toString());
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || 'Could not load orders.');

  const tbody = $('payTableBody'), empty = $('payEmpty');
  if (!d.orders.length){ tbody.innerHTML = ''; empty.style.display = 'block'; renderPagination(0, 1, d.pageSize); return; }
  empty.style.display = 'none';
  tbody.innerHTML = d.orders.map(o => `
    <tr>
      <td class="td-name"><b>#${escHtml(o.id)}</b></td>
      <td>${escHtml(o.customerName||'')}<span style="display:block;font-size:11px;color:var(--ink-soft)">${escHtml(o.customerPhone||'')}</span></td>
      <td>${escHtml((o.paymentMethod && o.paymentMethod.label) || '')}</td>
      <td class="td-total">${money(o.total)}</td>
      <td>${statusBadge(o.paymentStatus)}</td>
      <td class="td-date">${fmtDate(o.createdAt)}</td>
    </tr>`).join('');
  renderPagination(d.total, d.page, d.pageSize);
}

async function loadAll(){
  const btn = $('payRefresh');
  btn.classList.add('spin');
  try { await Promise.all([loadSummary(), loadOrders()]); }
  catch(e){ toast(e.message, 'bad'); }
  finally { btn.classList.remove('spin'); }
}

$('payRefresh').addEventListener('click', loadAll);
$('paySearch').addEventListener('input', (e)=>{
  clearTimeout(state.searchTimer);
  state.searchTimer = setTimeout(()=>{ state.q = e.target.value.trim(); state.page = 1; loadOrders().catch(err=>toast(err.message,'bad')); }, 350);
});
$('payStatusFilter').addEventListener('change', (e)=>{ state.payment = e.target.value; state.page = 1; loadOrders().catch(err=>toast(err.message,'bad')); });

/* ---------- go ---------- */
DashUI.requireAuth(()=> loadAll());
</script>
</body>
</html>
