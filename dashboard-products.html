<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<title>Products | The Pink Room Dashboard</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="dashboard-ui.css">
</head>
<body>

  <div class="db-shell">
    <div data-dash-sidebar></div>
    <main class="db-main">
      <div data-dash-mobile-topbar></div>
      <div class="db-wrap">
        <div class="db-page-head">
          <div><h1>Products</h1><p>Add, edit or remove anything in the catalogue.</p></div>
        </div>

        <div class="db-toolbar">
          <div class="db-search">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="prodSearch" placeholder="Search by name, slug or SKU...">
          </div>
          <select class="db-filter" id="prodCategoryFilter">
            <option value="">All categories</option>
          </select>
          <button class="db-add" id="btnAddProduct">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            ADD PRODUCT
          </button>
        </div>

        <div class="db-table-wrap">
          <table>
            <thead>
              <tr>
                <th>IMAGE</th><th>NAME</th><th>CATEGORY</th><th>PRICE</th><th>SALE PRICE</th><th>STOCK</th><th>AVAILABILITY</th><th></th>
              </tr>
            </thead>
            <tbody id="prodTableBody"></tbody>
          </table>
          <div class="db-empty" id="prodEmpty" style="display:none">
            <svg viewBox="0 0 24 24"><rect x="1" y="7" width="13" height="10" rx="1"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg>
            <p>No products match this search.</p>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="db-overlay" id="prodOverlay"></div>
  <aside class="db-drawer" id="prodDrawer">
    <div class="db-drawer-head">
      <h2 id="prodDrawerTitle">Product</h2>
      <button class="db-drawer-close" id="prodDrawerClose">&times;</button>
    </div>
    <div class="db-drawer-body" id="prodDrawerBody"></div>
  </aside>

<script src="dashboard-ui.js"></script>
<script>
const $ = id => document.getElementById(id);
const { money, escHtml, escAttr, toast } = DashUI;

// Categories/rooms are dashboard-editable now (Catalog Structure page) —
// loaded fresh on every visit instead of hardcoded, so a category/room
// added there shows up here immediately without a code change.
let CATEGORY_OPTIONS = [];
let ROOM_OPTIONS = [];
let TOP_SELLER_IDS = [];
// Sale campaigns (dashboard-coupons.html) — loaded here too so the
// product drawer's "Campaign" dropdown can show/edit which one (if any)
// this product belongs to, same source of truth as that page.
let PROMOTIONS = [];

async function loadPromotions(){
  try {
    const r = await fetch('/api/admin/coupons?action=promotions');
    const d = await r.json();
    if (d.ok) PROMOTIONS = d.promotions;
  } catch(e){ /* the dropdown just shows "None" if this fails — not fatal */ }
}

async function loadCatalogStructure(){
  try {
    const r = await fetch('/api/admin/settings');
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Could not load categories.');
    const categories = d.settings.categories || {};
    const rooms = d.settings.rooms || {};
    CATEGORY_OPTIONS = Object.keys(categories).map(id => ({
      value: id, label: categories[id].name,
      subs: (categories[id].subcategories || []).map(s => ({ value: s.slug, label: s.name }))
    }));
    ROOM_OPTIONS = Object.keys(rooms).map(id => ({ value: id, label: rooms[id].name }));
    TOP_SELLER_IDS = (d.settings.top_sellers || []).slice();

    $('prodCategoryFilter').innerHTML = '<option value="">All categories</option>' +
      CATEGORY_OPTIONS.map(c => `<option value="${c.value}">${escHtml(c.label)}</option>`).join('');
  } catch(e){
    toast(e.message, 'bad');
  }
}

let prodSearchTimer = null;

function productRow(p){
  const img = (p.images && p.images[0]) || 'logo-beige.png';
  // a product can also be listed under extra categories on top of its
  // primary one — show those under it so the table tells the whole story
  const extras = (p.extraCategories || [])
    .map(e => e.categoryName + (e.subcategoryName ? ' — ' + e.subcategoryName : ''));
  return `<tr>
    <td><div class="td-img"><img src="${escAttr(img)}" alt=""></div></td>
    <td class="td-name">${escHtml(p.name)}<span>${escHtml(p.slug)}</span></td>
    <td>${escHtml(p.categoryName)}${p.subcategoryName ? ' &mdash; ' + escHtml(p.subcategoryName) : ''}${extras.length ? `<span class="td-extracats">+ ${escHtml(extras.join(', '))}</span>` : ''}</td>
    <td>${p.price != null ? money(p.price) : '<span class="no-price">&mdash;</span>'}</td>
    <td>${p.salePrice != null ? money(p.salePrice) : '<span class="no-price">&mdash;</span>'}</td>
    <td>${p.trackInventory ? `<span style="color:${p.stockQuantity <= 0 ? 'var(--err)' : (p.stockQuantity <= p.lowStockThreshold ? 'var(--warn)' : 'inherit')}">${p.stockQuantity}</span>` : '<span class="no-price">&mdash;</span>'}</td>
    <td>${escHtml(p.availability || '')}</td>
    <td class="td-actions">
      <button class="btnEditProd" data-id="${escAttr(p.id)}" title="Edit"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button class="btnDeleteProd danger" data-id="${escAttr(p.id)}" data-name="${escAttr(p.name)}" title="Delete"><svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg></button>
    </td>
  </tr>`;
}

async function loadProducts(){
  const params = new URLSearchParams({ q: $('prodSearch').value.trim(), category: $('prodCategoryFilter').value });
  const tbody = $('prodTableBody');
  const empty = $('prodEmpty');
  try {
    const r = await fetch('/api/admin/products?' + params.toString());
    if (r.status === 401){ location.href = 'dashboard-login.html'; return; }
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Could not load products.');
    if (!d.products.length){
      tbody.innerHTML = '';
      empty.style.display = 'block';
      empty.querySelector('p').textContent = 'No products match this search.';
      return;
    }
    empty.style.display = 'none';
    tbody.innerHTML = d.products.map(productRow).join('');
  } catch(e){
    tbody.innerHTML = '';
    empty.style.display = 'block';
    empty.querySelector('p').textContent = e.message;
  }
}
$('prodSearch').addEventListener('input', ()=>{ clearTimeout(prodSearchTimer); prodSearchTimer = setTimeout(loadProducts, 350); });
$('prodCategoryFilter').addEventListener('change', loadProducts);
$('btnAddProduct').addEventListener('click', ()=> openProductDrawer(null));

$('prodTableBody').addEventListener('click', async (e)=>{
  const editBtn = e.target.closest('.btnEditProd');
  const delBtn = e.target.closest('.btnDeleteProd');
  if (editBtn){ openProductDrawer(editBtn.dataset.id); return; }
  if (delBtn){
    if (!confirm(`Delete "${delBtn.dataset.name}"? This can't be undone.`)) return;
    try {
      const r = await fetch('/api/admin/products?id=' + encodeURIComponent(delBtn.dataset.id), { method:'DELETE' });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'Delete failed.');
      toast('Product deleted.', 'ok');
      loadProducts();
    } catch(err){ toast(err.message, 'bad'); }
  }
});

/* ---------- product drawer ---------- */
const prodOverlay = $('prodOverlay'), prodDrawer = $('prodDrawer');
let drawerImages = [];
/* Color options for the open drawer — each { name, images: [url,...], stockQuantity }.
   images references the product's own photos (drawerImages) by URL, so a
   customer can be shown just that color's pictures on the product page. */
let drawerColors = [];
/* Extra categories currently ticked in the open drawer:
   { categorySlug: subcategorySlug | '' }. '' means the whole category
   (no subcategory). Kept outside the form markup so the ticks survive
   the list being re-rendered when the primary category changes. */
let drawerExtraCats = {};

function closeProductDrawer(){ prodDrawer.classList.remove('open'); prodOverlay.classList.remove('open'); }
prodOverlay.addEventListener('click', closeProductDrawer);
$('prodDrawerClose').addEventListener('click', closeProductDrawer);

async function openProductDrawer(id){
  prodDrawer.classList.add('open'); prodOverlay.classList.add('open');
  drawerImages = [];
  drawerExtraCats = {};
  drawerColors = [];
  loadPromotions(); // refresh in the background so the dropdown reflects the latest campaigns

  if (!id){
    $('prodDrawerTitle').textContent = 'Add Product';
    renderProductForm(null);
    return;
  }

  $('prodDrawerTitle').textContent = 'Edit Product';
  $('prodDrawerBody').innerHTML = '<p style="color:var(--ink-soft);font-size:13px">Loading…</p>';
  try {
    const r = await fetch('/api/admin/products?id=' + encodeURIComponent(id));
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Could not load this product.');
    drawerImages = (d.product.images || []).slice();
    (d.product.extraCategories || []).forEach(e => { drawerExtraCats[e.category] = e.subcategory || ''; });
    drawerColors = (d.product.colors || []).map(c => ({ name: c.name, images: (c.images || []).slice(), stockQuantity: c.stockQuantity || 0 }));
    renderProductForm(d.product);
  } catch(e){
    $('prodDrawerBody').innerHTML = `<p style="color:var(--err);font-size:13px">${escHtml(e.message)}</p>`;
  }
}

function populateSubcategories(categoryValue, selectedSub){
  const cat = CATEGORY_OPTIONS.find(c => c.value === categoryValue) || CATEGORY_OPTIONS[0];
  const sel = $('fSubcategory');
  sel.innerHTML = '<option value="">&mdash;</option>' + cat.subs.map(s => `<option value="${s.value}" ${s.value === selectedSub ? 'selected' : ''}>${s.label}</option>`).join('');
  sel.disabled = !cat.subs.length;
}

/* "Also show in" — every category except the primary one, each with an
   optional subcategory. Lets one product (a Sale piece, typically) be
   listed in as many other categories as the shop wants without giving
   up the primary category that drives its breadcrumb and product page. */
function renderExtraCategories(){
  const wrap = $('fExtraCats');
  if (!wrap) return;
  const primary = $('fCategory').value;
  const others = CATEGORY_OPTIONS.filter(c => c.value !== primary);

  if (!others.length){
    wrap.innerHTML = '<p style="font-size:12px;color:var(--ink-soft)">No other categories to choose from.</p>';
    return;
  }

  wrap.innerHTML = others.map(c => {
    const on  = Object.prototype.hasOwnProperty.call(drawerExtraCats, c.value);
    const sub = on ? (drawerExtraCats[c.value] || '') : '';
    return `<div class="db-extracat">
      <label class="db-checkline"><input type="checkbox" class="fExtraCat" value="${escAttr(c.value)}" ${on ? 'checked' : ''}> ${escHtml(c.label)}</label>
      ${c.subs.length ? `<select class="fExtraSub" data-cat="${escAttr(c.value)}" ${on ? '' : 'disabled'}>
        <option value="">Whole category</option>
        ${c.subs.map(s => `<option value="${escAttr(s.value)}" ${s.value === sub ? 'selected' : ''}>${escHtml(s.label)}</option>`).join('')}
      </select>` : '<span></span>'}
    </div>`;
  }).join('');

  wrap.querySelectorAll('.fExtraCat').forEach(cb => {
    cb.addEventListener('change', ()=>{
      const slug = cb.value;
      const sel = wrap.querySelector(`.fExtraSub[data-cat="${slug}"]`);
      if (cb.checked) drawerExtraCats[slug] = sel ? sel.value : '';
      else delete drawerExtraCats[slug];
      if (sel) sel.disabled = !cb.checked;
    });
  });
  wrap.querySelectorAll('.fExtraSub').forEach(sel => {
    sel.addEventListener('change', ()=>{
      const slug = sel.dataset.cat;
      if (Object.prototype.hasOwnProperty.call(drawerExtraCats, slug)) drawerExtraCats[slug] = sel.value;
    });
  });
}

function renderProductForm(p){
  const isEdit = !!p;
  $('prodDrawerBody').innerHTML = `
    <div class="db-field">
      <label>Product Images</label>
      <div class="db-images" id="imgList"></div>
      <p class="db-img-hint">Select as many photos as you want at once. Click any photo to make it the main one shown on cards — images are auto-resized.</p>
      <p class="db-save-msg" id="imgUploadMsg"></p>
      <input type="file" id="imgFileInput" accept="image/*" multiple style="display:none">
    </div>

    <div class="db-field">
      <label>Color Options (optional)</label>
      <div class="db-colors" id="colorList"></div>
      <button type="button" class="db-color-add" id="colorAddBtn"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>ADD COLOR</button>
      <p class="db-img-hint">Give a piece color choices — e.g. "Beige" and "White" — each with its own photos (pick from the photos above) and its own stock count. Leave empty for a product with no color choice. When colors are set, the Stock Quantity below is added up from them automatically.</p>
    </div>

    <div class="db-field"><label>Name</label><input type="text" id="fName" value="${escAttr(p && p.name || '')}"></div>

    <div class="db-2col">
      <div class="db-field"><label>Category</label>
        <select id="fCategory">${CATEGORY_OPTIONS.map(c => `<option value="${c.value}" ${p && p.category === c.value ? 'selected' : ''}>${c.label}</option>`).join('')}</select>
      </div>
      <div class="db-field"><label>Subcategory</label><select id="fSubcategory"></select></div>
    </div>

    <div class="db-field">
      <label>Also Show In &mdash; extra categories (optional)</label>
      <div class="db-extracats" id="fExtraCats"></div>
      <p class="db-img-hint">Tick any other category this piece should ALSO appear in &mdash; a Sale product can stay in Sale and still be listed under Accessories, Lighting, and so on. The Category above stays the main one (breadcrumb, product page, related items).</p>
    </div>

    <div class="db-2col">
      <div class="db-field"><label>Price (EGP)</label><input type="number" id="fPrice" value="${p && p.price != null ? p.price : ''}" min="0"></div>
      <div class="db-field"><label>Sale Price (EGP, optional)</label><input type="number" id="fSalePrice" value="${p && p.salePrice != null ? p.salePrice : ''}" min="0"></div>
    </div>

    <div class="db-field">
      <label>Sale Campaign (optional)</label>
      <select id="fCampaign">
        <option value="">None</option>
        ${PROMOTIONS.map(pm => `<option value="${pm.id}" ${p && pm.productIds.includes(p.id) ? 'selected' : ''}>${escHtml(pm.label)} — ${pm.value}% off${pm.active ? '' : ' (disabled)'}</option>`).join('')}
      </select>
      <p class="db-img-hint">Puts this product in an automatic sale campaign — the discount applies itself everywhere (banner, cart, checkout) with no code needed. Manage campaigns from the Coupons page.</p>
    </div>

    <div class="db-2col">
      <div class="db-field"><label>Size Bucket</label>
        <select id="fSize">
          <option value="">&mdash;</option>
          <option value="Small" ${p && p.size === 'Small' ? 'selected' : ''}>Small</option>
          <option value="Medium" ${p && p.size === 'Medium' ? 'selected' : ''}>Medium</option>
          <option value="Large" ${p && p.size === 'Large' ? 'selected' : ''}>Large</option>
        </select>
      </div>
      <div class="db-field"><label>Availability</label>
        <select id="fAvailability">
          <option value="In Stock" ${!p || p.availability === 'In Stock' ? 'selected' : ''}>In Stock</option>
          <option value="Out of Stock" ${p && p.availability === 'Out of Stock' ? 'selected' : ''}>Out of Stock</option>
          <option value="Made to Order" ${p && p.availability === 'Made to Order' ? 'selected' : ''}>Made to Order</option>
        </select>
      </div>
    </div>

    <div class="db-field"><label>Size Label &mdash; e.g. "100 cm W &times; 130 cm H"</label><input type="text" id="fSizeLabel" value="${escAttr(p && p.sizeLabel || '')}"></div>

    <div class="db-2col">
      <div class="db-field"><label>Material</label><input type="text" id="fMaterial" value="${escAttr(p && p.material || '')}"></div>
      <div class="db-field"><label>Color</label><input type="text" id="fColor" value="${escAttr(p && p.color || '')}"></div>
    </div>

    <div class="db-field"><label>SKU (optional)</label><input type="text" id="fSku" value="${escAttr(p && p.sku || '')}"></div>

    <label class="db-checkline"><input type="checkbox" id="fTrackInventory" ${p && p.trackInventory ? 'checked' : ''}> Track stock quantity for this product</label>
    <div class="db-2col" id="fStockFields" style="${p && p.trackInventory ? '' : 'display:none'}">
      <div class="db-field"><label>Stock Quantity</label><input type="number" id="fStockQuantity" value="${p && p.stockQuantity != null ? p.stockQuantity : 0}" min="0"></div>
      <div class="db-field"><label>Low Stock Alert Threshold</label><input type="number" id="fLowStockThreshold" value="${p && p.lowStockThreshold != null ? p.lowStockThreshold : 5}" min="0"></div>
    </div>
    <p class="db-img-hint" style="margin-top:-6px">If Color Options are set above, Stock Quantity is added up from them automatically and this number is ignored.</p>

    <div class="db-field"><label>Description</label><textarea id="fDescription">${escHtml(p && p.shortDescription || '')}</textarea></div>

    <div class="db-field">
      <label>Shop by Room &mdash; where this piece fits</label>
      ${ROOM_OPTIONS.map(r => `<label class="db-checkline"><input type="checkbox" class="fRoom" value="${escAttr(r.value)}" ${p && Array.isArray(p.rooms) && p.rooms.includes(r.value) ? 'checked' : ''}> ${escHtml(r.label)}</label>`).join('') || '<p style="font-size:12px;color:var(--ink-soft)">No rooms set up yet &mdash; add some from Catalog Structure.</p>'}
    </div>

    <label class="db-checkline"><input type="checkbox" id="fIsNew" ${p && p.isNew ? 'checked' : ''}> Mark as New Arrival</label>
    <label class="db-checkline"><input type="checkbox" id="fTopSeller" ${p && TOP_SELLER_IDS.includes(p.id) ? 'checked' : ''}> Feature in homepage Top Sellers</label>
    <label class="db-checkline"><input type="checkbox" id="fNotifySubs"> Email &ldquo;Stay Inspired&rdquo; subscribers about this<span id="fNotifySubsCount" style="color:var(--ink-soft);font-weight:400"></span></label>

    <button class="db-save" id="prodSaveBtn">${isEdit ? 'SAVE CHANGES' : 'CREATE PRODUCT'}</button>
    <p class="db-save-msg" id="prodSaveMsg"></p>
    ${isEdit ? `<button class="db-save outline" id="prodDeleteBtn" style="margin-top:10px;border-color:var(--err);color:var(--err)">DELETE THIS PRODUCT</button>` : ''}
  `;

  renderImageList();
  renderColorList();
  $('colorAddBtn').addEventListener('click', ()=>{
    drawerColors.push({ name: '', images: [], stockQuantity: 0 });
    renderColorList();
  });
  populateSubcategories(p && p.category, p && p.subcategory);
  renderExtraCategories();
  $('fCategory').addEventListener('change', ()=> {
    // a category can't be both the primary and an extra — drop the tick
    // if the newly chosen primary was ticked as an extra a moment ago
    delete drawerExtraCats[$('fCategory').value];
    populateSubcategories($('fCategory').value, null);
    renderExtraCategories();
  });
  $('fTrackInventory').addEventListener('change', (e)=> $('fStockFields').style.display = e.target.checked ? '' : 'none');

  fetch('/api/admin/customers?action=newsletter').then(r=>r.json()).then(d=>{
    if (d.ok) $('fNotifySubsCount').textContent = ` (${d.count} subscriber${d.count===1?'':'s'})`;
  }).catch(()=>{});

  if (isEdit) {
    $('prodDeleteBtn').addEventListener('click', async ()=>{
      if (!confirm(`Delete "${p.name}"? This removes it from the site completely and can't be undone.`)) return;
      const btn = $('prodDeleteBtn');
      btn.disabled = true;
      try {
        const r = await fetch('/api/admin/products?id=' + encodeURIComponent(p.id), { method: 'DELETE' });
        const d = await r.json();
        if (!d.ok) throw new Error(d.error || 'Delete failed.');
        toast('Product deleted.', 'ok');
        closeProductDrawer();
        loadProducts();
      } catch(e){
        toast(e.message, 'bad');
        btn.disabled = false;
      }
    });
  }

  $('imgFileInput').addEventListener('change', async (e)=>{
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    // one at a time — keeps the "uploading..." state on the ADD tile
    // accurate and each photo's own error (if any) reported separately
    for (const file of files) await addImageFile(file);
  });

  $('prodSaveBtn').addEventListener('click', ()=> saveProduct(isEdit ? p.id : null));
}

function renderImageList(){
  const wrap = $('imgList');
  wrap.innerHTML = drawerImages.map((url, i) => `
    <div class="db-img-tile ${i === 0 ? 'is-main' : ''}" data-i="${i}" title="${i === 0 ? 'Main photo' : 'Click to make this the main photo'}">
      <img src="${escAttr(url)}">
      ${i === 0 ? '<span class="db-img-tag">MAIN</span>' : ''}
      <button class="db-img-remove" data-i="${i}" aria-label="Remove">&times;</button>
    </div>`).join('') +
    `<div class="db-img-add" id="imgAddTile"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>ADD</div>`;

  wrap.querySelectorAll('.db-img-remove').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      e.stopPropagation();
      const [removed] = drawerImages.splice(Number(btn.dataset.i), 1);
      // a color pointing at a photo that just got removed drops that
      // reference — it simply shows one fewer picture on the product page
      if (removed) drawerColors.forEach(c => { c.images = c.images.filter(u => u !== removed); });
      renderImageList();
      renderColorList();
    });
  });
  // click anywhere else on a tile — pin that photo as image #1 (MAIN)
  wrap.querySelectorAll('.db-img-tile').forEach(tile=>{
    tile.addEventListener('click', ()=>{
      const i = Number(tile.dataset.i);
      if (i === 0) return;
      const [picked] = drawerImages.splice(i, 1);
      drawerImages.unshift(picked);
      renderImageList();
    });
  });
  $('imgAddTile').addEventListener('click', ()=> $('imgFileInput').click());
}

function renderColorList(){
  const wrap = $('colorList');
  if (!wrap) return;
  wrap.innerHTML = drawerColors.map((c, i) => `
    <div class="db-color-row" data-i="${i}">
      <div class="db-color-row-top">
        <input type="text" class="fColorName" placeholder="Color name (e.g. Beige)" value="${escAttr(c.name)}">
        <input type="number" class="fColorStock" placeholder="Stock" min="0" value="${c.stockQuantity}">
        <button type="button" class="db-color-remove" data-i="${i}" aria-label="Remove color">&times;</button>
      </div>
      <div class="db-color-imgs">
        ${drawerImages.length ? drawerImages.map(url => `<label class="db-color-img-pick ${c.images.includes(url) ? 'on' : ''}">
          <input type="checkbox" value="${escAttr(url)}" ${c.images.includes(url) ? 'checked' : ''}>
          <img src="${escAttr(url)}">
        </label>`).join('') : '<p style="font-size:11px;color:var(--ink-soft)">Add photos above first, then pick which ones show for this color.</p>'}
      </div>
    </div>`).join('') || '<p style="font-size:12px;color:var(--ink-soft)">No color options — this product will show one set of photos with no color choice.</p>';

  wrap.querySelectorAll('.fColorName').forEach((inp, i) => inp.addEventListener('input', ()=> { drawerColors[i].name = inp.value; }));
  wrap.querySelectorAll('.fColorStock').forEach((inp, i) => inp.addEventListener('input', ()=> { drawerColors[i].stockQuantity = Math.max(0, Math.round(Number(inp.value)) || 0); }));
  wrap.querySelectorAll('.db-color-remove').forEach(btn => btn.addEventListener('click', ()=>{
    drawerColors.splice(Number(btn.dataset.i), 1);
    renderColorList();
  }));
  wrap.querySelectorAll('.db-color-img-pick input').forEach(cb => {
    cb.addEventListener('change', ()=>{
      const row = cb.closest('.db-color-row');
      const i = Number(row.dataset.i);
      const url = cb.value;
      const c = drawerColors[i];
      const pick = cb.closest('.db-color-img-pick');
      if (cb.checked) { if (!c.images.includes(url)) c.images.push(url); pick.classList.add('on'); }
      else { c.images = c.images.filter(u => u !== url); pick.classList.remove('on'); }
    });
  });
}

/* Resizes to a max 1600px edge and re-encodes as JPEG before upload —
   keeps every upload comfortably under Vercel's request body limit and
   stops unoptimized phone photos from slowing the live site down. */
function compressImage(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read the file.'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not read the image.'));
      img.onload = () => {
        const maxDim = 1600;
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          if (width > height) { height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function addImageFile(file){
  const tile = $('imgAddTile');
  const msg = $('imgUploadMsg');
  msg.className = 'db-save-msg';
  tile.classList.add('uploading');
  try {
    const dataUrl = await compressImage(file);
    const resp = await fetch('/api/admin/products?action=upload', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, dataUrl })
    });
    const d = await resp.json();
    if (!d.ok) throw new Error(d.error || 'Upload failed.');
    drawerImages.push(d.url);
    renderImageList();
    renderColorList();
  } catch(e){
    msg.textContent = e.message; msg.className = 'db-save-msg show bad';
  } finally {
    if (document.body.contains(tile)) tile.classList.remove('uploading');
  }
}

async function saveProduct(existingId){
  const btn = $('prodSaveBtn');
  const msg = $('prodSaveMsg');
  btn.disabled = true;
  msg.className = 'db-save-msg';

  const category = $('fCategory').value;
  const catMeta = CATEGORY_OPTIONS.find(c => c.value === category);
  const subValue = $('fSubcategory').value || null;
  const subMeta = subValue ? catMeta.subs.find(s => s.value === subValue) : null;

  // extra categories the product is also listed under — names resolved
  // here (same as the primary) so the storefront can render them without
  // another lookup; the primary category can never be one of them
  const extraCategories = Object.keys(drawerExtraCats)
    .filter(slug => slug !== category)
    .map(slug => {
      const meta = CATEGORY_OPTIONS.find(c => c.value === slug);
      if (!meta) return null;
      const sv = drawerExtraCats[slug] || null;
      const sm = sv ? meta.subs.find(s => s.value === sv) : null;
      return {
        category: slug,
        categoryName: meta.label,
        subcategory: sm ? sv : null,
        subcategoryName: sm ? sm.label : null
      };
    })
    .filter(Boolean);

  const payload = {
    id: existingId || undefined,
    name: $('fName').value.trim(),
    category,
    categoryName: catMeta.label,
    subcategory: subValue,
    subcategoryName: subMeta ? subMeta.label : null,
    extraCategories,
    price: $('fPrice').value === '' ? null : Number($('fPrice').value),
    salePrice: $('fSalePrice').value === '' ? null : Number($('fSalePrice').value),
    images: drawerImages,
    colors: drawerColors.filter(c => c.name.trim()).map(c => ({ name: c.name.trim(), images: c.images.slice(), stockQuantity: c.stockQuantity })),
    size: $('fSize').value || null,
    sizeLabel: $('fSizeLabel').value.trim() || null,
    material: $('fMaterial').value.trim() || null,
    color: $('fColor').value.trim() || null,
    availability: $('fAvailability').value,
    sku: $('fSku').value.trim() || null,
    isNew: $('fIsNew').checked,
    rooms: Array.from(document.querySelectorAll('.fRoom:checked')).map(cb => cb.value),
    trackInventory: $('fTrackInventory').checked,
    stockQuantity: $('fStockQuantity').value === '' ? 0 : Number($('fStockQuantity').value),
    lowStockThreshold: $('fLowStockThreshold').value === '' ? 5 : Number($('fLowStockThreshold').value),
    shortDescription: $('fDescription').value.trim() || null,
    notifySubscribers: $('fNotifySubs').checked
  };
  const wantsTopSeller = $('fTopSeller').checked;
  // kept as a string throughout — PROMOTIONS.id comes back from the API
  // as a string (bigint columns aren't auto-numbered), and comparing it
  // against a Number() version always mismatched, re-toggling on every
  // single save even when the dropdown choice hadn't changed
  const wantsCampaignId = $('fCampaign').value || null;

  try {
    const resp = await fetch('/api/admin/products', {
      method: existingId ? 'PATCH' : 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const d = await resp.json();
    if (!d.ok) throw new Error(d.error || 'Save failed.');

    // Sale Campaign membership lives on the promotion row (product_ids),
    // not on the product itself — same reasoning as Top Sellers below.
    // Only touches it if the dropdown's choice actually changed, so a
    // product with no campaign picked stays untouched on every save.
    const savedIdForCampaign = d.product.id;
    const wasInCampaign = PROMOTIONS.find(pm => pm.productIds.includes(savedIdForCampaign));
    const currentCampaignId = wasInCampaign ? String(wasInCampaign.id) : null;
    if (wantsCampaignId !== currentCampaignId) {
      const campR = await fetch('/api/admin/coupons?action=toggle-promotion-product', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productId: savedIdForCampaign, promotionId: wantsCampaignId })
      });
      const campD = await campR.json();
      if (campD.ok) await loadPromotions();
    }

    // Top Sellers is a separate list (settings key `top_sellers`), not a
    // field on the product — sync it here so the checkbox actually does
    // something. Only touches the setting if this checkbox changed.
    const savedId = d.product.id;
    const wasTopSeller = TOP_SELLER_IDS.includes(savedId);
    if (wantsTopSeller !== wasTopSeller) {
      const next = wantsTopSeller ? [...TOP_SELLER_IDS, savedId] : TOP_SELLER_IDS.filter(id => id !== savedId);
      const setR = await fetch('/api/admin/settings', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key: 'top_sellers', value: next })
      });
      const setD = await setR.json();
      if (setD.ok) TOP_SELLER_IDS = next;
    }

    msg.textContent = 'Saved.'; msg.className = 'db-save-msg show ok';
    toast(existingId ? 'Product updated.' : 'Product created.', 'ok');
    if (payload.notifySubscribers && d.notify) {
      if (d.notify.ok) toast(`Emailed ${d.notify.sent} subscriber${d.notify.sent===1?'':'s'}${d.notify.failed ? `, ${d.notify.failed} failed` : ''}.`, d.notify.sent ? 'ok' : 'bad');
      else toast('Could not email subscribers: ' + (d.notify.error || 'unknown error'), 'bad');
    }
    loadProducts();
    setTimeout(closeProductDrawer, 700);
  } catch(e){
    msg.textContent = e.message; msg.className = 'db-save-msg show bad';
  } finally {
    btn.disabled = false;
  }
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeProductDrawer(); });

/* ---------- go ---------- */
DashUI.requireAuth(async ()=>{ await Promise.all([loadCatalogStructure(), loadPromotions()]); loadProducts(); });
</script>
