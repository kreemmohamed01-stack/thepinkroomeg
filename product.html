<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="seoTitle">Product | The Pink Room</title>
<meta id="seoDescription" name="description" content="Discover curated home decor at The Pink Room.">
<link rel="canonical" href="https://thepinkroomeg.com/product.html" id="seoCanonical">

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

<meta property="og:type" content="product">
<meta property="og:site_name" content="The Pink Room">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared-ui.css">
<style>
  :root{
    --cream:#f5f0e8;
    --cream-light:#f8f4ee;
    --beige:#e9dfd0;
    --beige-soft:#efe6d8;
    --gold:#c9a97c;
    --ink:#1c1a17;
    --ink-soft:#3a362f;
    --line:#d8cdbb;
    --shine: rgba(201,169,124,.55);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    font-family:'Poppins',sans-serif;
    background:var(--cream-light);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  a{text-decoration:none;color:inherit;}
  ul{list-style:none;}
  button{font-family:inherit;border:none;background:none;cursor:pointer;color:inherit;}
  img{display:block;max-width:100%;}

  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-3px);}}
  @keyframes fadeUp{to{opacity:1;transform:translateY(0);}}

  /* ---------- BREADCRUMB ---------- */
  .pdp-crumb{
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
    max-width:1400px;margin:0 auto;
    padding:22px 46px 0;
    font-size:12.5px;color:var(--ink-soft);
  }
  .pdp-crumb a{transition:color .3s ease;}
  .pdp-crumb a:hover{color:var(--gold);}
  .pdp-crumb svg{width:11px;height:11px;stroke:var(--ink-soft);fill:none;stroke-width:1.6;opacity:.5;}
  .pdp-crumb .current{color:var(--gold);}

  /* ---------- MAIN ---------- */
  .pdp{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:56px;
    max-width:1400px;margin:0 auto;
    padding:26px 46px 70px;
    align-items:start;
  }

  /* ---------- GALLERY ---------- */
  .gallery{position:sticky;top:92px;}
  .gal-stage{
    position:relative;
    background:var(--beige-soft);
    border:1px solid var(--line);
    border-radius:4px;
    overflow:hidden;
  }
  /* the swipe track is a mobile-only alternative to the stage */
  .gal-swipe{display:none;}
  .gal-stage img{
    width:100%;height:auto;display:block;
    transition:opacity .4s ease, transform 1.1s cubic-bezier(.16,1,.3,1);
  }
  .gal-stage.zoomed img{transform:scale(1.7);cursor:zoom-out;}
  .gal-zoom{
    position:absolute;top:14px;right:14px;z-index:3;
    width:36px;height:36px;border-radius:50%;
    background:rgba(255,255,255,.94);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(20,17,12,.14);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .gal-zoom svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.6;}
  .gal-zoom:hover{transform:scale(1.12);}
  .gal-arrow{
    position:absolute;top:50%;transform:translateY(-50%);z-index:3;
    width:38px;height:38px;border-radius:50%;
    background:rgba(255,255,255,.94);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 14px rgba(20,17,12,.14);
    transition:transform .3s cubic-bezier(.34,1.56,.64,1), background .3s ease;
  }
  .gal-arrow svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.7;}
  .gal-arrow.prev{left:14px;}
  .gal-arrow.next{right:14px;}
  .gal-arrow:hover{background:var(--ink);transform:translateY(-50%) scale(1.08);}
  .gal-arrow:hover svg{stroke:#fff;}

  .gal-thumbs{display:flex;gap:12px;margin-top:14px;}
  .gal-thumb{
    width:104px;height:104px;flex-shrink:0;
    border:1px solid var(--line);
    border-radius:3px;overflow:hidden;
    background:#fff;
    transition:border-color .3s ease, transform .3s ease;
  }
  .gal-thumb img{width:100%;height:100%;object-fit:contain;}
  .gal-thumb.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
  .gal-thumb:hover{transform:translateY(-2px);}
  .gal-counter{display:none;}

  /* ---------- INFO ---------- */
  .pdp-info{padding-top:6px;}
  .pdp-cat{
    font-size:11.5px;letter-spacing:3px;font-weight:600;
    color:var(--gold);margin-bottom:14px;
  }
  .pdp-name{
    font-family:'Playfair Display', serif;font-weight:400;
    font-size:38px;line-height:1.2;color:var(--ink);
    margin-bottom:18px;
  }
  .pdp-price{
    font-family:'Playfair Display', serif;
    font-size:25px;color:var(--ink);margin-bottom:6px;
    display:flex;align-items:baseline;gap:12px;
  }
  .pdp-price .was{
    font-family:'Poppins',sans-serif;font-size:16px;
    color:var(--ink-soft);text-decoration:line-through;opacity:.6;
  }
  .pdp-price .tbc{color:var(--ink-soft);opacity:.75;}
  .pdp-price .pct{
    font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:600;
    letter-spacing:.5px;color:#8a6a3c;background:rgba(138,106,60,.12);
    padding:4px 9px;border-radius:2px;
  }
  .pdp-tax{font-size:12.5px;color:var(--ink-soft);margin-bottom:24px;}
  .pdp-stock{font-size:12px;font-weight:600;letter-spacing:.4px;margin:-16px 0 24px;}
  .pdp-stock:empty{display:none;}
  .pdp-stock.oos{color:#b13b3b;}
  .pdp-stock.low{color:#a97a2e;}
  .pdp-rule{height:1px;background:var(--line);margin:24px 0;}
  .pdp-desc{font-size:14.5px;line-height:1.95;color:var(--ink-soft);}

  .pdp-highlights{display:flex;flex-direction:column;gap:14px;margin-top:26px;}
  .pdp-hl{display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--ink-soft);}
  .pdp-hl svg{width:17px;height:17px;stroke:var(--gold);fill:none;stroke-width:1.4;flex-shrink:0;}

  .pdp-field{margin-bottom:22px;}
  .pdp-label{
    display:block;font-size:11px;letter-spacing:2px;
    color:var(--ink-soft);margin-bottom:10px;
  }
  .pdp-label .val{color:var(--ink);font-weight:600;text-transform:none;letter-spacing:.3px;font-size:13px;}
  .pdp-swatches{display:flex;flex-wrap:wrap;gap:9px;}
  .pdp-swatch{
    padding:10px 18px;border:1px solid var(--line);border-radius:2px;
    font-size:12.5px;color:var(--ink);background:#fff;
    transition:border-color .25s ease,background .25s ease,color .25s ease;
  }
  .pdp-swatch:hover{border-color:var(--gold);}
  .pdp-swatch.active{border-color:var(--gold);background:var(--gold);color:var(--ink);font-weight:500;}
  .pdp-swatch.oos{color:var(--ink-soft);text-decoration:line-through;opacity:.55;cursor:not-allowed;}
  .pdp-swatch.oos:hover{border-color:var(--line);}
  .pdp-size-box{
    border:1px solid var(--line);
    background:var(--cream-light);
    border-radius:2px;
    padding:15px 18px;
    font-size:14px;color:var(--ink);
  }
  /* paintings are made to order — this offers a custom size instead of
     only the size shown, straight to WhatsApp so pricing/specifics can
     be worked out directly rather than guessed at in the cart */
  .pdp-customize{
    display:flex;align-items:center;gap:12px;
    margin-bottom:22px;
    padding:14px 16px;
    border:1px solid rgba(201,169,124,.4);
    background:rgba(201,169,124,.08);
    border-radius:3px;
    transition:border-color .3s ease, background .3s ease;
  }
  .pdp-customize:hover{border-color:var(--gold);background:rgba(201,169,124,.14);}
  .pdp-customize svg{width:22px;height:22px;stroke:var(--gold);fill:none;stroke-width:1.4;flex-shrink:0;}
  .pdp-customize span{font-size:13px;color:var(--ink-soft);line-height:1.5;}
  .pdp-customize span b{color:var(--ink);font-weight:600;}
  .qty-row{display:flex;align-items:center;border:1px solid var(--line);border-radius:2px;width:fit-content;}
  .qty-row button{
    width:44px;height:46px;
    display:flex;align-items:center;justify-content:center;
    font-size:17px;color:var(--ink-soft);
    transition:background .25s ease,color .25s ease;
  }
  .qty-row button:hover{background:var(--beige-soft);color:var(--ink);}
  .qty-row .val{
    min-width:56px;text-align:center;font-size:14px;
    border-left:1px solid var(--line);border-right:1px solid var(--line);
    line-height:46px;
  }
  .qty-row .val.bump{animation:qtyBump .3s ease;}
  @keyframes qtyBump{0%{transform:scale(1);}50%{transform:scale(1.25);}100%{transform:scale(1);}}

  .btn-bag{
    position:relative;overflow:hidden;isolation:isolate;
    width:100%;
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--ink);color:var(--cream-light);
    padding:19px;border-radius:2px;
    font-size:12.5px;letter-spacing:2.4px;font-weight:500;
    margin-bottom:12px;
    transition:transform .35s cubic-bezier(.34,1.56,.64,1), box-shadow .35s ease;
  }
  .btn-bag::before{
    content:'';position:absolute;top:0;left:-120%;
    width:60%;height:100%;
    background:linear-gradient(115deg,transparent 0%,var(--shine) 45%,rgba(255,255,255,.75) 50%,var(--shine) 55%,transparent 100%);
    transform:skewX(-20deg);transition:left .7s ease;z-index:1;
  }
  .btn-bag span{position:relative;z-index:2;}
  .btn-bag:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,17,12,.28);}
  .btn-bag:hover::before{left:120%;}
  .btn-bag.added{background:var(--gold);color:var(--ink);}
  .btn-bag:disabled{background:#8a8a8a;cursor:not-allowed;}
  .btn-bag:disabled:hover{transform:none;box-shadow:none;}

  .btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:28px;}
  .btn-ghost{
    display:flex;align-items:center;justify-content:center;gap:9px;
    border:1px solid var(--line);
    padding:15px;border-radius:2px;
    font-size:11.5px;letter-spacing:1.6px;color:var(--ink);
    transition:border-color .3s ease,background .3s ease,color .3s ease;
  }
  .btn-ghost svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;transition:fill .3s ease;}
  .btn-ghost:hover{border-color:var(--ink);background:var(--ink);color:#fff;}
  .btn-ghost.liked{border-color:var(--gold);color:var(--gold);}
  .btn-ghost.liked svg{fill:var(--gold);stroke:var(--gold);}
  .btn-ghost.liked:hover{background:var(--gold);color:var(--ink);}
  .btn-ghost.liked:hover svg{fill:var(--ink);stroke:var(--ink);}

  /* service rows */
  .svc{border-top:1px solid var(--line);}
  .svc-row{
    display:flex;align-items:center;gap:14px;
    width:100%;padding:19px 0;
    border-bottom:1px solid var(--line);
    text-align:left;
  }
  .svc-row > svg:first-child{width:21px;height:21px;stroke:var(--ink);fill:none;stroke-width:1.3;flex-shrink:0;}
  .svc-txt{flex:1;min-width:0;}
  .svc-txt b{display:block;font-size:13px;font-weight:600;margin-bottom:3px;}
  .svc-txt span{font-size:12.5px;color:var(--ink-soft);}
  .svc-txt a{color:var(--gold);border-bottom:1px solid transparent;transition:border-color .3s ease;}
  .svc-txt a:hover{border-color:var(--gold);}
  .svc-chev{width:15px;height:15px;stroke:var(--ink-soft);fill:none;stroke-width:1.6;flex-shrink:0;transition:transform .3s ease;}
  .svc-row:hover .svc-chev{transform:translateX(3px);}

  /* ---------- TABS ---------- */
  .pdp-tabs{max-width:1400px;margin:0 auto;padding:0 46px 80px;}
  .tab-heads{display:flex;gap:44px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;}
  .tab-heads::-webkit-scrollbar{display:none;}
  .tab-head{
    position:relative;padding:18px 0;
    font-size:12px;letter-spacing:2px;color:var(--ink-soft);
    white-space:nowrap;transition:color .3s ease;
  }
  .tab-head::after{
    content:'';position:absolute;left:0;right:0;bottom:-1px;height:1.5px;
    background:var(--gold);transform:scaleX(0);transform-origin:left;
    transition:transform .35s cubic-bezier(.16,1,.3,1);
  }
  .tab-head.active{color:var(--ink);}
  .tab-head.active::after{transform:scaleX(1);}
  .tab-panels{padding-top:34px;}
  .tab-panel{display:none;}
  .tab-panel.active{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:38px;}
  .tab-panel p{font-size:14px;line-height:1.9;color:var(--ink-soft);}
  .tab-panel h4{font-size:12.5px;font-weight:600;margin-bottom:8px;}
  .tab-panel .dim-img{border:1px solid var(--line);border-radius:3px;background:#fff;padding:10px;}
  .tab-panel .dim-img img{width:100%;height:auto;object-fit:contain;}
  .spec{display:flex;flex-direction:column;gap:12px;}
  .spec-row{display:flex;gap:12px;font-size:13.5px;}
  .spec-row dt{min-width:96px;color:var(--ink-soft);}
  .spec-row dd{color:var(--ink);font-weight:500;}

  /* ---------- RELATED ---------- */
  .related{
    background:var(--beige-soft);
    border-top:1px solid var(--line);
    padding:66px 46px 80px;
  }
  .related-title{
    font-family:'Playfair Display', serif;font-weight:400;font-style:italic;
    font-size:27px;text-align:center;color:var(--ink);margin-bottom:38px;
  }
  .related-grid{
    display:grid;grid-template-columns:repeat(3,1fr);align-items:start;gap:26px;
    max-width:1180px;margin:0 auto;
  }
  .rel-card{
    display:block;
    /* entrance is handled by the scroll-reveal system (shared-ui.js/css)
       now, not this unconditional animation */
  }
  .rel-media{
    position:relative;overflow:hidden;
    border:1px solid var(--line);border-radius:3px;background:#fff;
    margin-bottom:13px;
  }
  .rel-media img{width:100%;height:auto;display:block;transition:transform 1s cubic-bezier(.16,1,.3,1);}
  .rel-card:hover .rel-media img{transform:scale(1.06);}
  .rel-wish{
    position:absolute;top:10px;right:10px;z-index:2;
    width:32px;height:32px;border-radius:50%;
    background:rgba(255,255,255,.93);
    display:flex;align-items:center;justify-content:center;
    transition:transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .rel-wish svg{width:14px;height:14px;stroke:var(--ink);fill:none;stroke-width:1.5;transition:fill .3s ease,stroke .3s ease;}
  .rel-wish:hover{transform:scale(1.14);}
  .rel-wish.liked svg{fill:var(--gold);stroke:var(--gold);}
  .rel-name{font-size:13.5px;margin-bottom:4px;}
  .rel-price{font-size:13px;font-weight:600;color:var(--ink);}
  .rel-price .tbc{font-weight:400;color:var(--ink-soft);opacity:.7;}

  /* ---------- REVIEWS ---------- */
  .pdp-reviews{max-width:1400px;margin:0 auto;padding:10px 46px 70px;}
  .rev-head{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
  .rev-title{font-family:'Playfair Display', serif;font-weight:400;font-style:italic;font-size:24px;}
  .rev-summary{display:flex;align-items:center;gap:10px;}
  .rev-stars{display:flex;gap:2px;}
  .rev-stars svg{width:15px;height:15px;fill:none;stroke:var(--gold);stroke-width:1.5;}
  .rev-stars svg.filled{fill:var(--gold);}
  .rev-avg{font-size:13px;color:var(--ink-soft);}
  .rev-list{display:flex;flex-direction:column;gap:18px;margin-bottom:30px;}
  .rev-item{border:1px solid var(--line);border-radius:4px;padding:16px 18px;background:#fff;}
  .rev-item-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
  .rev-item-name{font-size:13px;font-weight:600;}
  .rev-item-date{font-size:11px;color:var(--ink-soft);}
  .rev-item-title{font-size:13px;font-weight:600;margin:4px 0 4px;}
  .rev-item-body{font-size:12.5px;color:var(--ink-soft);line-height:1.7;}
  .rev-empty{font-size:13px;color:var(--ink-soft);margin-bottom:26px;}
  .rev-form{border:1px solid var(--line);border-radius:4px;padding:22px 24px;max-width:520px;background:var(--beige-soft);}
  .rev-form h3{font-family:'Playfair Display',serif;font-weight:400;font-size:17px;margin-bottom:14px;}
  .rev-field{margin-bottom:14px;}
  .rev-field label{display:block;font-size:11px;letter-spacing:.6px;color:var(--ink-soft);margin-bottom:6px;}
  .rev-field input, .rev-field textarea{
    width:100%;border:1px solid var(--line);background:#fff;padding:10px 12px;border-radius:3px;font-size:12.5px;font-family:inherit;
  }
  .rev-field textarea{min-height:80px;resize:vertical;}
  .rev-star-input{display:flex;gap:4px;}
  .rev-star-input button{background:none;border:none;cursor:pointer;padding:2px;}
  .rev-star-input svg{width:20px;height:20px;fill:none;stroke:var(--gold);stroke-width:1.5;}
  .rev-star-input svg.filled{fill:var(--gold);}
  .rev-submit{
    background:var(--ink);color:#fff;padding:11px 26px;font-size:11px;letter-spacing:1.6px;border-radius:2px;
  }
  .rev-msg{font-size:12px;margin-top:10px;display:none;}
  .rev-msg.show{display:block;}
  .rev-msg.ok{color:#5a7a52;}
  .rev-msg.bad{color:#b0473f;}

  /* ---------- NOT FOUND ---------- */
  .pdp-missing{
    max-width:520px;margin:0 auto;padding:90px 24px 110px;text-align:center;
  }
  .pdp-missing h1{font-family:'Playfair Display',serif;font-weight:400;font-size:29px;margin-bottom:14px;}
  .pdp-missing p{font-size:14.5px;line-height:1.85;color:var(--ink-soft);margin-bottom:30px;}

  /* ================= TABLET ================= */
  @media (max-width:1100px){
    .pdp{grid-template-columns:1fr 1fr;gap:34px;padding:22px 26px 56px;}
    .pdp-crumb{padding:18px 26px 0;}
    .pdp-name{font-size:31px;}
    .pdp-tabs{padding:0 26px 60px;}
    .related{padding:52px 26px 62px;}
    .related-grid{gap:18px;}
    .gal-thumb{width:88px;height:88px;}
  }

  /* ================= MOBILE ================= */
  @media (max-width:760px){
    .pdp-crumb{padding:14px 18px 0;font-size:11.5px;}
    .pdp{grid-template-columns:1fr;gap:26px;padding:16px 18px 44px;}
    .gallery{position:static;}
    /* swipeable track replaces the click-through stage */
    .gal-stage{display:none;}
    .gal-swipe{
      display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
      border:1px solid var(--line);border-radius:3px;background:#fff;
    }
    .gal-swipe::-webkit-scrollbar{display:none;}
    .gal-swipe > div{
      flex:0 0 100%;scroll-snap-align:center;
      aspect-ratio:1/1;background:var(--beige-soft);
    }
    .gal-swipe img{width:100%;height:100%;object-fit:contain;}
    .gal-swipe img.contain{background:#fff;}
    .gal-thumbs{margin-top:12px;justify-content:center;}
    .gal-thumb{width:74px;height:74px;}
    .gal-counter{
      display:flex;align-items:center;justify-content:center;gap:16px;
      margin-top:12px;font-size:12.5px;color:var(--ink-soft);
    }
    .gal-counter button{
      width:28px;height:28px;display:flex;align-items:center;justify-content:center;
      color:var(--ink-soft);
    }
    .gal-counter svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7;}
    .pdp-name{font-size:27px;}
    .pdp-price{font-size:22px;}
    .btn-row{grid-template-columns:1fr;}
    .pdp-tabs{padding:0 18px 46px;}
    .tab-heads{gap:26px;}
    .tab-head{font-size:11px;letter-spacing:1.4px;}
    .tab-panel.active{grid-template-columns:1fr;gap:26px;}
    .related{padding:42px 18px 56px;}
    .related-title{font-size:22px;margin-bottom:26px;}
    .related-grid{grid-template-columns:repeat(2,1fr);gap:14px;}
    .rel-name{font-size:12.5px;}
  }
</style>
</head>
<body>

  <div data-tpr-nav></div>

  <div id="pdpRoot"></div>

<script src="analytics.js"></script>
<script src="catalog.js"></script>
<script src="i18n.js"></script>
<script src="shared-ui.js"></script>
<script>
/* ============================================================
   PRODUCT PAGE — one template, driven entirely by ?slug=
   Fields the client hasn't supplied yet are simply not rendered.
   ============================================================ */
const ICON = {
  chev:  '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
  prev:  '<svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>',
  next:  '<svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>',
  heart: '<svg viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>',
  share: '<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>',
  truck: '<svg viewBox="0 0 24 24"><rect x="1" y="7" width="13" height="10" rx="1"/><path d="M14 10h4l3 3v4h-7z"/><circle cx="6" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg>',
  shield:'<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V6l8-3Z"/><polyline points="9 12 11 14 15 10"/></svg>',
  help:  '<svg viewBox="0 0 24 24"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="2" y="13" width="5" height="7" rx="2"/><rect x="17" y="13" width="5" height="7" rx="2"/><path d="M20 20a4 4 0 0 1-4 4h-2"/></svg>',
  zoom:  '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>',
  leaf:  '<svg viewBox="0 0 24 24"><path d="M4 20c0-8 6-14 16-15 0 10-6 15-13 15Z"/><line x1="4" y1="20" x2="12" y2="12"/></svg>',
  bulb:  '<svg viewBox="0 0 24 24"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.5.4.8.9.9 1.5l.1.6h5l.1-.6c.1-.6.4-1.1.9-1.5A6 6 0 0 0 12 3Z"/></svg>',
  ruler: '<svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="1.5"/><line x1="6" y1="7" x2="6" y2="11"/><line x1="10" y1="7" x2="10" y2="11"/><line x1="14" y1="7" x2="14" y2="11"/><line x1="18" y1="7" x2="18" y2="11"/></svg>'
};

const money = n => 'EGP ' + Number(n).toLocaleString('en-US');
const escHtml = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const slug  = new URLSearchParams(location.search).get('slug');
const root  = document.getElementById('pdpRoot');

// products now come from the database — wait for catalog.js's fetch to
// land before looking the slug up, same pattern used everywhere else in
// the site an async data source replaced a hardcoded one.
PRODUCTS_READY.then(()=>{
  const product = typeof getProductBySlug === 'function' ? getProductBySlug(slug) : null;

  if (!product){
    document.title = 'Product not found | The Pink Room';
    root.innerHTML = `
      <div class="pdp-missing">
        <h1>We couldn&rsquo;t find that piece.</h1>
        <p>It may have been renamed or is no longer available. Browse the full collection to find something you love.</p>
        <a class="tpr-btn" href="category.html?cat=all">BROWSE THE COLLECTION</a>
      </div>`;
  } else {
    if (window.TPRAnalytics){
      window.TPRAnalytics.trackEvent('product_view', {
        productId: product.id, productName: product.name,
        category: product.category, categoryName: product.categoryName
      });
    }
    buildPage(product);
    // #pdpWhatsApp is re-patched from the real Store Settings by the
    // shared handler in catalog.js once SITE_STRUCTURE_READY resolves.
    // #pdpCustomizeWA carries a product-specific ?text= message the
    // shared handler doesn't know about, so it's patched here instead,
    // preserving everything after the phone number.
    if (typeof SITE_STRUCTURE_READY !== 'undefined') {
      SITE_STRUCTURE_READY.then(()=>{
        const el = document.getElementById('pdpCustomizeWA');
        if (el && STORE_SETTINGS.whatsapp) {
          const num = String(STORE_SETTINGS.whatsapp).replace(/[^0-9]/g, '');
          el.href = el.href.replace(/wa\.me\/\d*/, 'wa.me/' + num);
        }
      });
    }
  }
});

function priceMarkup(p){
  if (p.salePrice){
    const pct = Math.round((1 - p.salePrice / p.price) * 100);
    return `${money(p.salePrice)} <span class="was">${money(p.price)}</span> <span class="pct">-${pct}%</span>`;
  }
  if (p.price != null) return money(p.price);
  return `<span class="tbc">EGP &mdash;</span>`;
}

/* Highlights are derived only from the client's own description — nothing invented. */
function highlightsFor(p){
  const d = (p.shortDescription || '').toLowerCase();
  const out = [];
  if (d.includes('lighting') || d.includes('glow')) out.push([ICON.bulb, 'Warm integrated lighting']);
  if (d.includes('sculptur')) out.push([ICON.leaf, 'Sculptural design']);
  if (d.includes('pair') || d.includes('set of')) out.push([ICON.leaf, 'Coordinated pair']);
  return out;
}

function updateSeoTags(p){
  const title = p.name + ' | The Pink Room';
  document.title = title;
  const titleEl = document.getElementById('seoTitle'); if (titleEl) titleEl.textContent = title;

  const desc = (p.shortDescription || `Discover the ${p.name} at The Pink Room — curated home decor delivered across Egypt.`).slice(0, 300);
  const descEl = document.getElementById('seoDescription'); if (descEl) descEl.setAttribute('content', desc);

  // /products/:slug exists as a prettier rewrite in vercel.json but is
  // currently broken in production (404) — using the confirmed-working
  // ?slug= form until that's fixed, so canonical never points at a 404.
  const url = 'https://thepinkroomeg.com/product?slug=' + p.slug;
  const canonicalEl = document.getElementById('seoCanonical'); if (canonicalEl) canonicalEl.setAttribute('href', url);

  const img = (p.images && p.images[0]) ? new URL(p.images[0], location.href).href : 'https://thepinkroomeg.com/logo-footer-new.png';
  const setMeta = (attr, val, content) => {
    let el = document.querySelector(`meta[${attr}="${val}"]`);
    if (!el){ el = document.createElement('meta'); el.setAttribute(attr, val); document.head.appendChild(el); }
    el.setAttribute('content', content);
  };
  setMeta('property', 'og:title', title);
  setMeta('property', 'og:description', desc);
  setMeta('property', 'og:image', img);
  setMeta('property', 'og:url', url);
  setMeta('name', 'twitter:title', title);
  setMeta('name', 'twitter:description', desc);
  setMeta('name', 'twitter:image', img);

  const price = p.salePrice != null ? p.salePrice : p.price;
  const ld = {
    '@context': 'https://schema.org',
    '@type': 'Product',
    name: p.name,
    image: (p.images || []).map(i => new URL(i, location.href).href),
    description: desc,
    sku: p.sku || p.id,
    brand: { '@type': 'Brand', name: 'The Pink Room' },
    offers: {
      '@type': 'Offer',
      url,
      priceCurrency: 'EGP',
      price: price != null ? price : undefined,
      availability: p.availability === 'Out of Stock' ? 'https://schema.org/OutOfStock' : 'https://schema.org/InStock'
    }
  };
  const ldScript = document.createElement('script');
  ldScript.type = 'application/ld+json';
  ldScript.textContent = JSON.stringify(ld);
  document.head.appendChild(ldScript);
}

/* Color-specific photos if that color has any picked, else every photo
   (so a color added without picking photos still shows something). No
   colors on the product at all ⇒ just the product's own image list. */
function imagesForColor(p, colorName){
  const all = p.images || [];
  if (!colorName || !Array.isArray(p.colors)) return all;
  const c = p.colors.find(x => x.name === colorName);
  return (c && c.images && c.images.length) ? c.images : all;
}

/* Stock status for the product as a whole, or for one color when the
   product has color options — everything that shows "Sold Out"/"Only N
   left" reads from this instead of the raw fields directly. */
function stockInfoFor(p, colorName){
  const isOOS = window.TPR && window.TPR.isOutOfStock ? window.TPR.isOutOfStock : ()=>false;
  if (colorName && Array.isArray(p.colors) && p.colors.length){
    const c = p.colors.find(x => x.name === colorName);
    const qty = c ? Number(c.stockQuantity) : 0;
    const oos = isOOS(p, colorName);
    return { oos, low: !oos && qty > 0 && qty <= (p.lowStockThreshold || 5), qty };
  }
  const oos = isOOS(p);
  const qty = Number(p.stockQuantity) || 0;
  return { oos, low: !oos && p.trackInventory && qty > 0 && qty <= (p.lowStockThreshold || 5), qty };
}

function buildPage(p){
  updateSeoTags(p);
  document.title = p.name + ' | The Pink Room';
  // p.size is just the internal filter bucket (Small/Medium/Large) — only
  // p.sizeLabel is real client-supplied copy, so only that renders here.
  const sizeText = p.sizeLabel || '';

  const hasColors = Array.isArray(p.colors) && p.colors.length > 0;
  // default to the first color that's actually in stock, so a shopper
  // isn't greeted by a sold-out selection when another color is available
  const pdpState = { color: hasColors ? ((p.colors.find(c => c.stockQuantity > 0) || p.colors[0]).name) : null };

  const imgs = imagesForColor(p, pdpState.color);
  // by convention each pair is [lifestyle, dimensions] — odd indices are the dimensions plate
  // (covers both a single 2-image product and multi-finish products with several pairs)
  const isDim = i => i % 2 === 1;

  const hl = highlightsFor(p);
  // "related" = anything sharing ANY category with this piece, so a
  // product placed in several categories (see productPlacements in
  // catalog.js) is related to everything it sits beside on the site
  const ownCats = productPlacements(p).map(pl => pl.category);
  const related = PRODUCTS.filter(x =>
    x.slug !== p.slug && productPlacements(x).some(pl => ownCats.includes(pl.category))
  ).slice(0, 3);

  const stock = stockInfoFor(p, pdpState.color);
  const oos = stock.oos;

  // paintings are made to order — offer a custom size straight to
  // WhatsApp instead of only the size shown on the listing
  const customizeMsg = encodeURIComponent(`Hi! I'd like to ask about a custom size for "${p.name}".`);
  const customizeWaNum = String(STORE_SETTINGS.whatsapp || '').replace(/[^0-9]/g, '');

  root.innerHTML = `
  <nav class="pdp-crumb">
    <a href="index.html">Home</a>${ICON.chev}
    <a href="category.html?cat=${p.category}">${p.categoryName}</a>${ICON.chev}
    <span class="current">${p.name}</span>
  </nav>

  <div class="pdp">
    <div class="gallery">
      <div class="gal-stage" id="galStage">
        <button class="gal-zoom" id="galZoom" aria-label="Zoom">${ICON.zoom}</button>
        ${imgs.length > 1 ? `<button class="gal-arrow prev" id="galPrev" aria-label="Previous image">${ICON.prev}</button>
        <button class="gal-arrow next" id="galNext" aria-label="Next image">${ICON.next}</button>` : ''}
        <img id="galImg" src="${imgs[0]}" alt="${p.name}">
      </div>

      <div class="gal-swipe" id="galSwipe">
        ${imgs.map((src,i)=>`<div><img src="${src}" alt="${p.name} ${isDim(i)?'dimensions':''}" class="${isDim(i)?'contain':''}"></div>`).join('')}
      </div>

      <div class="gal-thumbs" id="galThumbs">
        ${imgs.map((src,i)=>`<button class="gal-thumb ${i===0?'active':''} ${isDim(i)?'contain':''}" data-i="${i}">
          <img src="${src}" alt="View ${i+1}">
        </button>`).join('')}
      </div>

      <div class="gal-counter">
        <button id="cntPrev" aria-label="Previous">${ICON.prev}</button>
        <span id="galCount">1 / ${imgs.length}</span>
        <button id="cntNext" aria-label="Next">${ICON.next}</button>
      </div>
    </div>

    <div class="pdp-info">
      <p class="pdp-cat">${p.categoryName.toUpperCase()}</p>
      <h1 class="pdp-name">${p.name}</h1>
      <div class="pdp-price">${priceMarkup(p)}</div>
      <p class="pdp-tax">Tax included.</p>
      <p class="pdp-stock ${stock.oos ? 'oos' : (stock.low ? 'low' : '')}" id="pdpStockMsg">${stock.oos ? 'Sold Out' : (stock.low ? `Only ${stock.qty} left in stock` : '')}</p>
      <div class="pdp-rule"></div>

      <p class="pdp-desc">${p.shortDescription || ''}</p>

      ${hl.length ? `<div class="pdp-highlights">
        ${hl.map(([svg,txt])=>`<div class="pdp-hl">${svg}<span>${txt}</span></div>`).join('')}
      </div>` : ''}

      <div class="pdp-rule"></div>

      ${sizeText ? `<div class="pdp-field">
        <span class="pdp-label">SIZE</span>
        <div class="pdp-size-box">${sizeText}</div>
      </div>` : ''}

      ${hasColors ? `<div class="pdp-field">
        <span class="pdp-label">COLOR<span class="val" id="pdpColorLabel"> &mdash; ${escHtml(pdpState.color)}</span></span>
        <div class="pdp-swatches" id="pdpSwatches">
          ${p.colors.map(c => {
            const cOos = window.TPR && window.TPR.isOutOfStock ? window.TPR.isOutOfStock(p, c.name) : c.stockQuantity <= 0;
            return `<button type="button" class="pdp-swatch ${c.name === pdpState.color ? 'active' : ''} ${cOos ? 'oos' : ''}" data-color="${escHtml(c.name)}" ${cOos ? 'disabled' : ''}>${escHtml(c.name)}${cOos ? ' &mdash; Sold Out' : ''}</button>`;
          }).join('')}
        </div>
      </div>` : ''}

      ${p.category === 'paintings' ? `<a class="pdp-customize" id="pdpCustomizeWA" href="https://wa.me/${customizeWaNum}?text=${customizeMsg}" target="_blank" rel="noopener">
        ${ICON.ruler}
        <span>Need a different size? Every piece is hand-painted to order — <b>Customize This Piece</b> and we'll work out the size with you.</span>
      </a>` : ''}

      <div class="pdp-field" id="qtyFieldWrap" style="${oos ? 'display:none' : ''}">
        <span class="pdp-label">QUANTITY</span>
        <div class="qty-row">
          <button id="qtyMinus" aria-label="Decrease">&minus;</button>
          <span class="val" id="qtyVal">1</span>
          <button id="qtyPlus" aria-label="Increase">+</button>
        </div>
      </div>

      <button class="btn-bag" id="btnBag" ${oos ? 'disabled' : ''}><span>${oos ? 'SOLD OUT' : 'ADD TO BAG'}</span></button>

      <div class="btn-row">
        <button class="btn-ghost ${window.TPR && window.TPR.isWished(p.id) ? 'liked' : ''}" id="btnWish" data-id="${p.id}">${ICON.heart} ADD TO WISHLIST</button>
        <button class="btn-ghost" id="btnShare">${ICON.share} SHARE</button>
      </div>

      <div class="svc">
        <div class="svc-row">
          ${ICON.truck}
          <span class="svc-txt"><b>Estimated Delivery</b><span>3 - 5 business days</span></span>
          <svg class="svc-chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </div>
        <a class="svc-row" id="pdpWhatsApp" href="https://wa.me/${String(STORE_SETTINGS.whatsapp||'').replace(/[^0-9]/g,'')}" target="_blank" rel="noopener">
          ${ICON.help}
          <span class="svc-txt"><b>Need Help?</b><span>Contact us anytime</span></span>
          <svg class="svc-chev" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
        </a>
      </div>
    </div>
  </div>

  <div class="pdp-tabs">
    <div class="tab-heads" id="tabHeads">
      <button class="tab-head active" data-t="details">DETAILS</button>
      ${sizeText ? `<button class="tab-head" data-t="dimensions">DIMENSIONS</button>` : ''}
      ${(p.material || p.color) ? `<button class="tab-head" data-t="material">MATERIAL &amp; CARE</button>` : ''}
      <button class="tab-head" data-t="shipping">SHIPPING &amp; RETURNS</button>
    </div>
    <div class="tab-panels">
      <div class="tab-panel active" data-p="details">
        <p>${p.shortDescription || ''}</p>
      </div>

      ${sizeText ? `<div class="tab-panel" data-p="dimensions">
        <div>
          <h4>${sizeText}</h4>
          <dl class="spec">
            ${p.dimensions && p.dimensions.width ? `<div class="spec-row"><dt>Width</dt><dd>${p.dimensions.width}</dd></div>` : ''}
            ${p.dimensions && p.dimensions.height ? `<div class="spec-row"><dt>Height</dt><dd>${p.dimensions.height}</dd></div>` : ''}
            ${p.dimensions && p.dimensions.note ? `<div class="spec-row"><dt>Note</dt><dd>${p.dimensions.note}</dd></div>` : ''}
          </dl>
        </div>
        ${imgs[1] ? `<div class="dim-img"><img src="${imgs[1]}" alt="${p.name} dimensions"></div>` : ''}
      </div>` : ''}

      ${(p.material || p.color) ? `<div class="tab-panel" data-p="material">
        <dl class="spec">
          ${p.material ? `<div class="spec-row"><dt>Material</dt><dd>${p.material}</dd></div>` : ''}
          ${p.color ? `<div class="spec-row"><dt>Colour</dt><dd>${p.color}</dd></div>` : ''}
        </dl>
      </div>` : ''}

      <div class="tab-panel" data-p="shipping">
        <p>We offer reliable delivery across Egypt. Estimated delivery is 3 - 5 business days.</p>
        <p>If you&rsquo;re not completely satisfied, you can return your item within <strong>14 days</strong> of delivery.
        <a href="refund-return-policy.html" style="color:var(--gold);border-bottom:1px solid var(--gold)">View our Return Policy &rarr;</a></p>
      </div>
    </div>
  </div>

  <section class="pdp-reviews" id="pdpReviews">
    <p style="font-size:12.5px;color:var(--ink-soft)">Loading reviews&hellip;</p>
  </section>

  ${related.length ? `<section class="related">
    <h2 class="related-title">You May Also Like</h2>
    <div class="related-grid">
      ${related.map((r,i)=>`
        <a class="rel-card" href="product.html?slug=${r.slug}" style="animation-delay:${i*0.06}s">
          <div class="rel-media">
            <button class="rel-wish ${window.TPR && window.TPR.isWished(r.id) ? 'liked' : ''}" data-id="${r.id}" aria-label="Add to wishlist">${ICON.heart}</button>
            <img src="${r.images[0]}" alt="${r.name}" loading="lazy">
          </div>
          <p class="rel-name">${r.name}</p>
          <p class="rel-price">${priceMarkup(r)}</p>
        </a>`).join('')}
    </div>
  </section>` : ''}
  `;

  const galleryApi = wireGallery(imgs, isDim, p.name);
  wireActions(p, pdpState);
  if (hasColors) wireColorSwatches(p, pdpState, galleryApi);
  wireTabs();
  loadReviews(p);
}

/* Re-picks the gallery images and refreshes the stock line / quantity /
   Add to Bag button for the newly chosen color — everything else on the
   page (name, price, description…) doesn't depend on color, so nothing
   else needs to change. */
function wireColorSwatches(p, pdpState, galleryApi){
  const swatches = document.getElementById('pdpSwatches');
  if (!swatches) return;
  swatches.addEventListener('click', e => {
    const btn = e.target.closest('.pdp-swatch');
    if (!btn || btn.disabled) return;
    pdpState.color = btn.dataset.color;

    swatches.querySelectorAll('.pdp-swatch').forEach(b => b.classList.toggle('active', b === btn));
    const label = document.getElementById('pdpColorLabel');
    if (label) label.textContent = ' — ' + pdpState.color;

    galleryApi.setImages(imagesForColor(p, pdpState.color));

    const stock = stockInfoFor(p, pdpState.color);
    const msg = document.getElementById('pdpStockMsg');
    if (msg){
      msg.className = 'pdp-stock' + (stock.oos ? ' oos' : (stock.low ? ' low' : ''));
      msg.textContent = stock.oos ? 'Sold Out' : (stock.low ? `Only ${stock.qty} left in stock` : '');
    }
    const qtyWrap = document.getElementById('qtyFieldWrap');
    if (qtyWrap) qtyWrap.style.display = stock.oos ? 'none' : '';
    const bag = document.getElementById('btnBag');
    if (bag){
      bag.disabled = stock.oos;
      bag.querySelector('span').textContent = stock.oos ? 'SOLD OUT' : 'ADD TO BAG';
    }
  });
}

/* ---------- reviews ---------- */
const STAR_SVG = '<svg viewBox="0 0 24 24"><path d="M12 2.5l3 6.5 7 1-5 5 1.2 7-6.2-3.5-6.2 3.5 1.2-7-5-5 7-1z"/></svg>';
function starsHtml(rating, size){
  let html = '';
  for (let i = 1; i <= 5; i++) html += `<span style="display:inline-flex">${STAR_SVG.replace('<svg', `<svg class="${i <= rating ? 'filled' : ''}"`)}</span>`;
  return html;
}
function fmtReviewDate(ts){
  return new Date(ts).toLocaleDateString('en-US', { day:'numeric', month:'short', year:'numeric' });
}

async function loadReviews(p){
  const el = document.getElementById('pdpReviews');
  try {
    const r = await fetch('/api/products?action=reviews&productId=' + encodeURIComponent(p.id));
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'Could not load reviews.');

    const list = d.reviews.length ? `<div class="rev-list">${d.reviews.map(rv => `
      <div class="rev-item">
        <div class="rev-item-head">
          <span class="rev-item-name">${(rv.name||'').replace(/[<>&]/g,'')}</span>
          <span class="rev-item-date">${fmtReviewDate(rv.createdAt)}</span>
        </div>
        <div class="rev-stars">${starsHtml(rv.rating)}</div>
        ${rv.title ? `<p class="rev-item-title">${rv.title.replace(/[<>&]/g,'')}</p>` : ''}
        ${rv.body ? `<p class="rev-item-body">${rv.body.replace(/[<>&]/g,'')}</p>` : ''}
      </div>`).join('')}</div>` : `<p class="rev-empty">No reviews yet — be the first to share your thoughts.</p>`;

    el.innerHTML = `
      <div class="rev-head">
        <h2 class="rev-title">Customer Reviews</h2>
        ${d.count ? `<div class="rev-summary"><div class="rev-stars">${starsHtml(Math.round(d.average))}</div><span class="rev-avg">${d.average.toFixed(1)} out of 5 &middot; ${d.count} review${d.count===1?'':'s'}</span></div>` : ''}
      </div>
      ${list}
      <div class="rev-form">
        <h3>Write a Review</h3>
        <div class="rev-field"><label>Your rating</label><div class="rev-star-input" id="revStarInput">${[1,2,3,4,5].map(i=>`<button type="button" data-v="${i}">${STAR_SVG}</button>`).join('')}</div></div>
        <div class="rev-field"><label>Your name</label><input type="text" id="revName"></div>
        <div class="rev-field"><label>Review title (optional)</label><input type="text" id="revTitle"></div>
        <div class="rev-field"><label>Your review</label><textarea id="revBody"></textarea></div>
        <button class="rev-submit" id="revSubmit">SUBMIT REVIEW</button>
        <p class="rev-msg" id="revMsg"></p>
      </div>
    `;
    wireReviewForm(p);
  } catch(e){
    el.innerHTML = `<h2 class="rev-title">Customer Reviews</h2><p class="rev-empty">Reviews are unavailable right now.</p>`;
  }
}

function wireReviewForm(p){
  let selectedRating = 0;
  const starBtns = Array.from(document.querySelectorAll('#revStarInput button'));
  function paintStars(n){
    starBtns.forEach(b => b.querySelector('svg').classList.toggle('filled', +b.dataset.v <= n));
  }
  starBtns.forEach(b => {
    b.addEventListener('mouseenter', ()=> paintStars(+b.dataset.v));
    b.addEventListener('mouseleave', ()=> paintStars(selectedRating));
    b.addEventListener('click', ()=>{ selectedRating = +b.dataset.v; paintStars(selectedRating); });
  });

  document.getElementById('revSubmit').addEventListener('click', async ()=>{
    const msg = document.getElementById('revMsg');
    const btn = document.getElementById('revSubmit');
    const name = document.getElementById('revName').value.trim();
    const title = document.getElementById('revTitle').value.trim();
    const body = document.getElementById('revBody').value.trim();

    if (!selectedRating){ msg.textContent = 'Please choose a star rating.'; msg.className = 'rev-msg show bad'; return; }
    if (!name){ msg.textContent = 'Please enter your name.'; msg.className = 'rev-msg show bad'; return; }
    if (!body){ msg.textContent = 'Please write your review.'; msg.className = 'rev-msg show bad'; return; }

    btn.disabled = true;
    try {
      const r = await fetch('/api/products?action=review', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ productId: p.id, name, rating: selectedRating, title, body })
      });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'Could not submit review.');
      msg.textContent = 'Thank you — your review is awaiting a quick check before it appears here.';
      msg.className = 'rev-msg show ok';
      document.getElementById('revName').value = '';
      document.getElementById('revTitle').value = '';
      document.getElementById('revBody').value = '';
      selectedRating = 0; paintStars(0);
    } catch(e){
      msg.textContent = e.message; msg.className = 'rev-msg show bad';
    } finally {
      btn.disabled = false;
    }
  });
}

/* ---------- gallery ----------
   Owns its own thumbs/swipe markup (rebuilt on demand) rather than only
   indexing into what buildPage first rendered, so a color swap can hand
   it a whole new image list via the returned setImages(). */
function wireGallery(initialImgs, isDim, altName){
  let imgs = initialImgs;
  let idx = 0;
  const stage      = document.getElementById('galStage');
  const img        = document.getElementById('galImg');
  const swipe      = document.getElementById('galSwipe');
  const thumbsWrap = document.getElementById('galThumbs');
  const count      = document.getElementById('galCount');
  const prev = document.getElementById('galPrev'), next = document.getElementById('galNext');

  function renderThumbsAndSwipe(){
    thumbsWrap.innerHTML = imgs.map((src,i)=>`<button class="gal-thumb ${isDim(i)?'contain':''}" data-i="${i}"><img src="${src}" alt="View ${i+1}"></button>`).join('');
    if (swipe) swipe.innerHTML = imgs.map((src,i)=>`<div><img src="${src}" alt="${altName} ${isDim(i)?'dimensions':''}" class="${isDim(i)?'contain':''}"></div>`).join('');
    thumbsWrap.querySelectorAll('.gal-thumb').forEach(t => t.addEventListener('click', ()=> show(+t.dataset.i)));
    const showArrows = imgs.length > 1;
    if (prev) prev.style.display = showArrows ? '' : 'none';
    if (next) next.style.display = showArrows ? '' : 'none';
  }

  function show(i){
    idx = (i + imgs.length) % imgs.length;
    img.style.opacity = '0';
    setTimeout(()=>{
      img.src = imgs[idx];
      img.classList.toggle('contain', isDim(idx));
      img.style.opacity = '1';
    }, 160);
    thumbsWrap.querySelectorAll('.gal-thumb').forEach((t,n)=> t.classList.toggle('active', n === idx));
    if (count) count.textContent = (idx+1) + ' / ' + imgs.length;
    stage.classList.remove('zoomed');
    if (swipe) swipe.scrollTo({ left: swipe.clientWidth * idx, behavior:'smooth' });
  }

  if (prev) prev.addEventListener('click', ()=> show(idx - 1));
  if (next) next.addEventListener('click', ()=> show(idx + 1));
  const cPrev = document.getElementById('cntPrev'), cNext = document.getElementById('cntNext');
  if (cPrev) cPrev.addEventListener('click', ()=> show(idx - 1));
  if (cNext) cNext.addEventListener('click', ()=> show(idx + 1));

  const zoom = document.getElementById('galZoom');
  if (zoom) zoom.addEventListener('click', ()=> stage.classList.toggle('zoomed'));
  stage.addEventListener('click', e => {
    if (e.target.closest('.gal-arrow') || e.target.closest('.gal-zoom')) return;
    stage.classList.toggle('zoomed');
  });

  // keep the counter honest when the user swipes on mobile
  if (swipe){
    let t;
    swipe.addEventListener('scroll', ()=>{
      clearTimeout(t);
      t = setTimeout(()=>{
        const i = Math.round(swipe.scrollLeft / swipe.clientWidth);
        if (i !== idx){
          idx = i;
          thumbsWrap.querySelectorAll('.gal-thumb').forEach((th,n)=> th.classList.toggle('active', n === idx));
          if (count) count.textContent = (idx+1) + ' / ' + imgs.length;
        }
      }, 90);
    }, { passive:true });
  }

  renderThumbsAndSwipe();
  show(0);

  return {
    setImages(newImgs){
      imgs = (newImgs && newImgs.length) ? newImgs : imgs;
      renderThumbsAndSwipe();
      show(0);
    }
  };
}

/* ---------- quantity, bag, wishlist, share ---------- */
function wireActions(p, pdpState){
  let qty = 1;
  const val = document.getElementById('qtyVal');
  const bump = ()=>{ val.classList.add('bump'); setTimeout(()=> val.classList.remove('bump'), 300); };

  // hidden (via qtyFieldWrap) rather than unrendered now, since a color
  // swap can show/hide it, but the buttons themselves are always present
  const qtyPlusEl = document.getElementById('qtyPlus');
  const qtyMinusEl = document.getElementById('qtyMinus');
  if (qtyPlusEl) qtyPlusEl.addEventListener('click', ()=>{ qty++; val.textContent = qty; bump(); });
  if (qtyMinusEl) qtyMinusEl.addEventListener('click', ()=>{ qty = Math.max(1, qty-1); val.textContent = qty; bump(); });

  const bag = document.getElementById('btnBag');
  bag.addEventListener('click', ()=>{
    if (bag.disabled) return;
    if (window.TPR) for (let i=0;i<qty;i++) window.TPR.addToCart(p, pdpState.color);
    bag.classList.add('added');
    bag.querySelector('span').textContent = 'ADDED TO BAG';
    setTimeout(()=>{ bag.classList.remove('added'); bag.querySelector('span').textContent = 'ADD TO BAG'; }, 1600);
  });

  const wish = document.getElementById('btnWish');
  wish.addEventListener('click', ()=>{
    const liked = window.TPR ? window.TPR.toggleWishlist(p.id) : wish.classList.toggle('liked');
    wish.classList.toggle('liked', liked);
  });

  document.getElementById('btnShare').addEventListener('click', async ()=>{
    const data = { title: p.name, text: p.shortDescription || p.name, url: location.href };
    try {
      if (navigator.share) await navigator.share(data);
      else {
        await navigator.clipboard.writeText(location.href);
        const b = document.getElementById('btnShare');
        const old = b.innerHTML;
        b.textContent = 'LINK COPIED';
        setTimeout(()=>{ b.innerHTML = old; }, 1500);
      }
    } catch(e){ /* user dismissed the share sheet */ }
  });

  document.querySelectorAll('.rel-wish').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.preventDefault(); e.stopPropagation();
      const liked = window.TPR ? window.TPR.toggleWishlist(btn.dataset.id) : btn.classList.toggle('liked');
      btn.classList.toggle('liked', liked);
    });
  });
}

/* ---------- tabs ---------- */
function wireTabs(){
  const heads = [...document.querySelectorAll('.tab-head')];
  const panels = [...document.querySelectorAll('.tab-panel')];
  heads.forEach(h=>{
    h.addEventListener('click', ()=>{
      heads.forEach(x=> x.classList.toggle('active', x === h));
      panels.forEach(pn=> pn.classList.toggle('active', pn.dataset.p === h.dataset.t));
    });
  });
}
